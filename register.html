<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Registration | NovaMed Multi-Specialty Hospital</title>
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="assets/css/style.css">
    <script>
        tailwind.config = { darkMode: ['class', '[data-theme="dark"]'], theme: { extend: { colors: { primary: 'var(--primary-color)', 'primary-dark': 'var(--primary-dark)', secondary: 'var(--secondary-color)', theme: { bg: 'var(--bg-main)', card: 'var(--bg-card)', text: 'var(--text-main)', muted: 'var(--text-muted)', border: 'var(--border-color)', } }, fontFamily: { sans: ['Inter', 'sans-serif'], } } } }
    </script>
</head>
<body class="bg-theme text-theme antialiased min-h-screen flex items-center justify-center p-4 py-12">
    
    <!-- Controls top right -->
    <div class="fixed top-4 right-4 flex items-center gap-2">
        <button id="theme-toggle" class="p-2 rounded-full hover:bg-theme-card border border-theme-border transition-colors"><i id="theme-icon" data-lucide="moon" class="w-5 h-5 text-theme-text"></i></button>
        <button id="rtl-toggle" class="p-2 rounded-full hover:bg-theme-card border border-theme-border transition-colors"><i id="rtl-icon" data-lucide="arrow-right-left" class="w-5 h-5 text-theme-text"></i></button>
    </div>

    <!-- Auth Card -->
    <div class="w-full max-w-lg bg-theme-card border border-theme-border rounded-3xl shadow-2xl p-8 sm:p-10">
        <!-- Logo -->
        <a href="index.html" class="flex flex-row items-center justify-center gap-3 mb-8">
            <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-primary to-secondary flex items-center justify-center text-white shadow-lg">
                <i data-lucide="heart-pulse" class="w-6 h-6"></i>
            </div>
            <span class="text-xl font-bold tracking-tight">NovaMed</span>
        </a>

        <div class="text-center mb-8">
            <h1 class="text-xl font-bold mb-2">Create Your Patient ID</h1>
            <p class="text-theme-muted text-sm">Register for instant doctor booking, digital reports, and online billing.</p>
        </div>

        <form class="space-y-5" onsubmit="event.preventDefault(); window.location.href='patient-portal.html'">
            <div class="grid grid-cols-1 gap-4">
                <div>
                    <label class="block text-sm font-medium mb-1">First Name</label>
                    <input type="text" required class="block w-full px-4 py-3 bg-theme border border-theme-border rounded-xl focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-all">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Last Name</label>
                    <input type="text" required class="block w-full px-4 py-3 bg-theme border border-theme-border rounded-xl focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-all">
                </div>
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Email Address</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-theme-muted">
                        <i data-lucide="mail" class="w-5 h-5"></i>
                    </div>
                    <input type="email" required class="block w-full pl-10 pr-3 py-3 bg-theme border border-theme-border rounded-xl focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-all">
                </div>
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">City / Residential Address</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-theme-muted">
                        <i data-lucide="map-pin" class="w-5 h-5"></i>
                    </div>
                    <input type="text" placeholder="Portland, OR" required class="block w-full pl-10 pr-3 py-3 bg-theme border border-theme-border rounded-xl focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-all">
                </div>
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Primary Department / Insurance Provider (Optional)</label>
                <input type="text" placeholder="e.g. Cardiology, Pediatrics, BlueShield PPO" class="block w-full px-4 py-3 bg-theme border border-theme-border rounded-xl focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-all">
            </div>
            
            <div class="grid grid-cols-1 gap-4">
                <div>
                    <label class="block text-sm font-medium mb-1">Password</label>
                    <div class="relative">
                        <input type="password" required class="block w-full pl-4 pr-10 py-3 bg-theme border border-theme-border rounded-xl focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-all">
                        <button type="button" class="toggle-password absolute inset-y-0 right-0 pr-3 flex items-center">
                            <i data-lucide="eye" class="w-5 h-5 text-theme-muted"></i>
                        </button>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Confirm Password</label>
                    <div class="relative">
                        <input type="password" required class="block w-full pl-4 pr-10 py-3 bg-theme border border-theme-border rounded-xl focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-all">
                        <button type="button" class="toggle-password absolute inset-y-0 right-0 pr-3 flex items-center">
                            <i data-lucide="eye" class="w-5 h-5 text-theme-muted"></i>
                        </button>
                    </div>
                </div>
            </div>
            
            <div>
                <label class="flex items-start gap-3 cursor-pointer mt-2">
                    <input type="checkbox" required class="mt-1 rounded border-theme-border text-primary focus:ring-primary">
                    <span class="text-sm font-medium text-theme-muted">I consent to the <a href="#" class="text-primary hover:underline">Patient Privacy Notice</a>, <a href="#" class="text-primary hover:underline">HIPAA Digital Records Policy</a>, and hospital terms.</span>
                </label>
            </div>

            <button type="submit" class="w-full bg-primary hover:bg-primary-dark text-white font-bold py-3.5 rounded-xl shadow-md transition-all mt-4">Create Patient Account</button>
        </form>

        <div class="mt-8">
            <div class="relative">
                <div class="absolute inset-0 flex items-center">
                    <div class="w-full border-t border-theme-border"></div>
                </div>
                <div class="relative flex justify-center text-sm">
                    <span class="px-4 bg-theme-card text-theme-muted font-medium">Or register with</span>
                </div>
            </div>

            <div class="mt-6 grid grid-cols-3 gap-3">
                <button type="button" onclick="window.location.href='patient-portal.html'" class="flex justify-center items-center py-2.5 border border-theme-border bg-theme-card rounded-xl hover:-translate-y-1 hover:shadow-md hover:border-primary/40 transition-all duration-300 cursor-pointer">
                    <svg class="w-5 h-5" viewBox="0 0 24 24">
                        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                    </svg>
                </button>
                <button type="button" onclick="window.location.href='patient-portal.html'" class="flex justify-center items-center py-2.5 border border-theme-border bg-theme-card rounded-xl hover:-translate-y-1 hover:shadow-md hover:border-primary/50 transition-all duration-300 cursor-pointer">
                    <svg class="w-5 h-5" fill="#0f766e" viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.469h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.469h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
                </button>
                <button type="button" onclick="window.location.href='patient-portal.html'" class="flex justify-center items-center py-2.5 border border-theme-border bg-theme-card rounded-xl hover:-translate-y-1 hover:shadow-md hover:border-primary/40 transition-all duration-300 cursor-pointer">
                    <svg class="w-5 h-5 text-theme-text" viewBox="0 0 24 24" fill="currentColor"><path d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09l.01-.01zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/></svg>
                </button>
            </div>
        </div>

        <p class="mt-8 text-center text-sm text-theme-muted">
            Already registered at NovaMed? <a href="login.html" class="font-bold text-primary hover:underline">Login here</a>
        </p>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/lucide@0.260.0"></script>
    <script src="assets/js/theme.js"></script>
    <script src="assets/js/validation.js"></script>
</body>
</html>
